<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* รูปแบบการ์ด (Card Style) */
        .ai-parenting-card {
            font-family: 'Sarabun', 'Prompt', sans-serif; /* ใช้ฟอนต์ไทยที่อ่านง่าย */
            max-width: 350px;
            background: linear-gradient(135deg, #ffffff 0%, #f0f7ff 100%); /* สีฟ้าพาสเทลอ่อนๆ */
            border-radius: 20px;
            padding: 24px;
            text-align: center;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.08);
            border: 2px solid #e2e8f0;
            margin: 20px auto;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        /* เอฟเฟกต์ตอนนำเมาส์ไปชี้ */
        .ai-parenting-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.12);
        }

        .ai-icon {
            font-size: 50px;
            margin-bottom: 12px;
        }

        .ai-title {
            color: #2d3748;
            font-size: 1.25rem;
            font-weight: bold;
            margin: 0 0 10px 0;
        }

        .ai-description {
            color: #4a5568;
            font-size: 0.95rem;
            margin: 0 0 24px 0;
            line-height: 1.6;
        }

        /* รูปแบบปุ่มกด (Button) */
        .ai-btn {
            display: inline-block;
            background-color: #4299e1; /* สีฟ้าสบายตา */
            color: white;
            text-decoration: none;
            padding: 12px 28px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 1rem;
            transition: background-color 0.3s ease;
        }

        .ai-btn:hover {
            background-color: #3182ce;
        }

        /* ข้อความแจ้งเตือนเล็กๆ ด้านล่าง */
        .ai-disclaimer {
            font-size: 0.75rem;
            color: #a0aec0;
            margin-top: 16px;
        }
    </style>
</head>
<body>

    <!-- เริ่มต้นส่วนของการ์ด AI -->
    <div class="ai-parenting-card">
        <div class="ai-icon">🍼🤖</div>
        <h3 class="ai-title">ผู้ช่วย AI พ่อแม่มือใหม่</h3>
        <p class="ai-description">สงสัยเรื่องการดูแลลูกน้อย? ไม่ว่าจะเป็นการนอน การให้นม หรือการร้องไห้ ปรึกษา AI ของเราได้เลย 24 ชม.</p>
        
        <!-- ลิงก์ที่เชื่อมไปยัง AI พร้อมคำถามเริ่มต้น (Prompt) ตรง parameter 'q=' -->
        <a href="https://gemini.google.com/app?q=ฉันเป็นพ่อแม่มือใหม่+ขอคำแนะนำวิธีดูแลเด็กแรกเกิด+และตารางการนอนเบื้องต้นที่ควรรู้หน่อย"
           target="_blank"
           rel="noopener noreferrer"
           class="ai-btn">
           ปรึกษา AI ทันที
        </a>
        
        <div class="ai-disclaimer">*คำแนะนำจาก AI เป็นเพียงข้อมูลเบื้องต้น หากน้องมีอาการป่วยควรพบแพทย์</div>
    </div>
    <!-- สิ้นสุดส่วนของการ์ด AI -->

</body>
</html>
