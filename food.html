<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>โภชนาการเด็ก - baby Gole</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/styles.css">
    <style>
        .food-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        .food-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .food-header h1 {
            color: #667eea;
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .age-filter {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 10px 20px;
            border: 2px solid #ddd;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Kanit', sans-serif;
        }

        .filter-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .food-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 22px;
        }

        .food-card {
            background: linear-gradient(180deg, #ffffff 0%, #fbfcff 100%);
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.12);
            border: 1px solid rgba(102, 126, 234, 0.08);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .food-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 16px 30px rgba(102, 126, 234, 0.15);
        }

        .food-image {
            width: 100%;
            height: 210px;
            object-fit: cover;
            display: block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .food-info {
            padding: 18px 18px 20px;
        }

        .food-name {
            font-size: 1.12rem;
            font-weight: 600;
            color: #2f3157;
            margin-bottom: 10px;
        }

        .food-age {
            display: inline-block;
            background: linear-gradient(135deg, #eff5ff 0%, #e7f3ff 100%);
            color: #3d5fd8;
            padding: 6px 10px;
            border-radius: 999px;
            font-size: 0.82rem;
            font-weight: 500;
            margin-bottom: 12px;
        }

        .food-description {
            color: #666;
            font-size: 0.95rem;
            line-height: 1.55;
            margin-bottom: 14px;
        }

        .food-benefits,
        .food-method {
            border-radius: 12px;
            padding: 12px 12px 11px;
            font-size: 0.88rem;
            line-height: 1.6;
        }

        .food-benefits {
            background: #f7f9ff;
            color: #4c577a;
            margin-bottom: 10px;
        }

        .food-method {
            background: #edf9f2;
            color: #2f6b45;
        }

        .food-benefits strong,
        .food-method strong {
            color: #23314d;
        }
    </style>
</head>
<body>
    <div class="food-container">
        <div class="food-header">
            <h1><i class="fas fa-bowl-food"></i> 50+ เมนูโภชนาการลูกรัก</h1>
            <p style="color: #999;">เมนูอาหารสำหรับเด็กตามอายุของลูกน้อย</p>
        </div>

        <div class="age-filter">
            <button class="filter-btn active" onclick="filterFood('all')">ทั้งหมด</button>
            <button class="filter-btn" onclick="filterFood('6m')">6 เดือน</button>
            <button class="filter-btn" onclick="filterFood('8m')">8 เดือน</button>
            <button class="filter-btn" onclick="filterFood('10m')">10 เดือน</button>
            <button class="filter-btn" onclick="filterFood('1y')">1 ปี</button>
            <button class="filter-btn" onclick="filterFood('2y')">2 ปี+</button>
        </div>

        <div class="food-grid" id="foodGrid">
            <!-- Food cards will be generated here -->
        </div>
    </div>

    <script>
        const foods = [
           
            

           

        function filterFood(age) {
            const btns = document.querySelectorAll('.filter-btn');
            btns.forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');

            const filtered = age === 'all' ? foods : foods.filter(f => f.age === age);
            
            document.getElementById('foodGrid').innerHTML = filtered.map(f => `
                <div class="food-card">
                    <img class="food-image" src="${f.image}" alt="${f.name}" />
                    <div class="food-info">
                        <div class="food-name">${f.name}</div>
                        <span class="food-age">อายุ ${f.age === '6m' ? '6 เดือน' : 
                            f.age === '8m' ? '8 เดือน' : 
                            f.age === '10m' ? '10 เดือน' : 
                            f.age === '1y' ? '1 ปี' : '2 ปีขึ้นไป'}</span>
                        <p class="food-description">${f.desc}</p>
                        <div class="food-benefits"><strong>✓ ประโยชน์:</strong> ${f.benefits}</div>
                        <div class="food-method"><strong>วิธีทำ:</strong> ${f.method}</div>
                    </div>
                </div>
            `).join('');
        }

        // Initialize
        filterFood('all');
    </script>
</body>
</html>
